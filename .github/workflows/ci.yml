name: CI

# Validates every pull request and every push to main: the same checks the
# daily health check runs, plus a full extension build. This is the gate human
# PRs must pass before merging.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Health check (type-check, lint, syntax, manifest, tests, audit)
        run: npm run health-check

      - name: Build the extension
        run: npm run build
