name: Daily health check

# Runs once a day, checks the project for errors (syntax + tests), and files
# a GitHub issue when something is broken. A single rolling issue is reused so
# the repo does not get spammed with one new issue per day; the issue is
# updated on each failing run and closed automatically once checks pass again.

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run project health check
        id: health
        continue-on-error: true
        run: node scripts/health-check.mjs

      - name: File or resolve health-check issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'automated-health-check';
            const title = '🤖 Daily health check: failing checks detected';
            const healthy = '${{ steps.health.outcome }}' === 'success';

            let report = '_No report file was produced; see the workflow logs._';
            try { report = fs.readFileSync('health-report.md', 'utf8'); } catch (e) {}

            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const issue = openIssues.find((i) => !i.pull_request);

            const header = `_Maintained automatically by the [daily health check workflow](${runUrl}). ` +
              `Updated on each failing run and closed automatically once all checks pass._\n\n`;
            const body = header + report;

            if (!healthy) {
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
                core.notice(`Updated existing health-check issue #${issue.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title, body, labels: [label],
                });
                core.notice(`Opened health-check issue #${created.data.number}`);
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ All checks pass as of the latest [run](${runUrl}). Closing automatically.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
              core.notice(`Closed health-check issue #${issue.number}`);
            } else {
              core.notice('Project is healthy and there is no open issue. Nothing to do.');
            }
